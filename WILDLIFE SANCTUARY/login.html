<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIN PAGE</title>
    <style>
      body {
        background-color: rgb(245, 245, 245);
        flex-direction: row-reverse;
        text-align: -webkit-center;
        align-content: center;
        display: flex;
        justify-content: center;
        position: relative;
        top: 250px;
        left: 10px;
      }
      .box {
        border: 2px solid black;
        background-color: rgb(56, 154, 172);
        flex-direction: column;
        text-align: center;
        align-content: center;
        width: 20%;
        justify-content: center;
      }

      .login-button {
        display: inline-block;
        background-color: rgb(24, 175, 202);
        color: white;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 6px;
        width: 150px;
        margin: 16px auto;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h1>login in account</h1>
      <br />
      Name:<input type="text" name="username" placeholder="Enter Username" />
      <br />
      <br />
      Password:<input
        type="password"
        name="password"
        placeholder="Enter Password"
      />
      <br />
      <br />
      Email:<input type="email" name="email" placeholder="Enter Email" />
      <br />
      <br />
      <a class="login-button" href="project.html">Login Project</a>
    </div>
  </body>
</html>
